name: chart-vendor
description: Ensure all charts are vendored with all the patches.

inputs:
  working-directory:
    description: Path to the working directory
    default: ${{ github.workspace }}
  config-file:
    description: Configuration file for the vendored charts
    default: .charts.yml
  charts-root:
    description: Root path where charts are generated
    default: charts

runs:
  using: composite
  steps:
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: "${{ github.action_path }}/go.mod"
    - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
      with:
        path: ~/.cache/helm/content
        key: helm-content-${{ hashFiles(format('{0}/{1}', inputs.working-directory, inputs.config-file)) }}
        restore-keys: helm-content-
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: go install
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: chart-vendor --config-file ${{ inputs.config-file }} --charts-root ${{ inputs.charts-root }} --check
